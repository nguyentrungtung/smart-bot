services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-smartsales}
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: [ "infra", "backend" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-smartsales}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    profiles: [ "infra", "backend" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm_proxy:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${MY_GEMINI_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-proxy}
      - STORE_MODEL_IN_DB=False
      - LOCAL_MODEL_API_BASE=${LOCAL_MODEL_API_BASE:-http://host.docker.internal:1234/v1}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-smartsales}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: [ "--config", "/app/config.yaml" ]
    depends_on:
      - redis
      - postgres
    profiles: [ "infra", "backend" ]

  core_backend:
    build: ./core_backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-smartsales}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LITELLM_API_BASE=${LITELLM_API_BASE}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-litellm-proxy}
      - LLM_MODEL=${LLM_MODEL:-lm-studio-model}
      - GEMINI_API_KEY=${MY_GEMINI_KEY}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      - MULTIMODAL_ENABLED=${MULTIMODAL_ENABLED:-False}
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
      - redis
      - litellm_proxy
    volumes:
      - ./core_backend:/app
      - ./.keys:/app/.keys:ro
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app" ]
    profiles: [ "backend" ]

  mcp_server:
    build: ./mcp_servers
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - MCP_INTERNAL_API_KEY=${MCP_INTERNAL_API_KEY}
    profiles: [ "tools", "backend" ]

volumes:
  pgdata:
