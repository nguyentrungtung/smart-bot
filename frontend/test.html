<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Bot Widget Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            text-align: center;
            margin-top: 5rem;
            max-width: 600px;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
        }

        p {
            color: #7f8c8d;
            line-height: 1.6;
        }

        /* The Widget Iframe Container */
        #smart-bot-container {
            position: fixed;
            bottom: 0;
            right: 0;
            z-index: 1000;
            border: none;
            overflow: hidden;
            transition: all 0.3s ease;
            /* Initial size - will be updated by postMessage */
            width: 80px;
            height: 80px;
        }

        #smart-bot-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Smart-Bot Integration Demo</h1>
        <p>This page simulates a client's website embedding the Smart-Bot advisor via a secure iframe. The widget
            dynamically resizes itself based on its internal content using a 2-way postMessage bridge.</p>
    </div>

    <!-- ⚡ Tích hợp Smart-Bot Advisor (Login & Auto-Refresh Token) -->
    <script>
        (function (w, d, s, o, f, js, fjs) {
            w['SmartBotObject'] = o; w[o] = w[o] || function () { (w[o].q = w[o].q || []).push(arguments) }, w[o].l = 1 * new Date();
            js = d.createElement(s), fjs = d.getElementsByTagName(s)[0];
            js.id = o; js.src = f; js.async = 1; fjs.parentNode.insertBefore(js, fjs);
        }(window, document, 'script', 'smartbot', 'http://localhost:5173/embed.js'));

        // Lưu trữ Token ở Frontend trang cha
        let botTokens = { access: null, refresh: null };

        /**
         * 1. Thực hiện Đăng nhập vào Smart-Bot Backend
         */
        async function authenticateChatbot() {
            try {
                // Gọi tới backend để lấy token (Lưu ý: Partner nên proxy qua Backend của mình để bảo mật)
                const response = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: "user68",
                        password: "password123"
                    })
                });

                const data = await response.json();
                botTokens.access = data.access_token;
                botTokens.refresh = data.refresh_token;

                // Nạp Access Token vào Bot
                smartbot('init', { token: botTokens.access });
                console.log("Chatbot authenticated successfully.");

                // 2. Thiết lập tự động Refresh Token mỗi 45 phút (Đảm bảo refresh trước khi Access Token 1h hết hạn)
                setInterval(refreshBotToken, 45 * 60 * 1000);

            } catch (err) {
                console.error("Authentication failed:", err);
            }
        }

        /**
         * 3. Hàm làm mới Token dùng Refresh Token
         */
        async function refreshBotToken() {
            console.log("Rotating bot token...");
            const response = await fetch('http://localhost:8000/api/v1/auth/refresh', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh_token: botTokens.refresh })
            });

            if (response.ok) {
                const data = await response.json();
                botTokens.access = data.access_token;
                // Cập nhật Token mới cho Bot mà không cần reload iframe
                smartbot('init', { token: botTokens.access });
                console.log("Token rotated successfully.");
            }
        }

        // Bắt đầu quy trình
        authenticateChatbot();
    </script>
</body>

</html>
