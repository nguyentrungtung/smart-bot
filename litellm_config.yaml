model_list:
  # Chat Model
  - model_name: lm-studio-model
    litellm_params:
      model: openai/local-model
      api_base: os.environ/LOCAL_MODEL_API_BASE
      api_key: "lm-studio"
      rpm: 100 # Adjust based on local machine
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  
  # Embedding Model
  - model_name: lm-studio-embedding
    litellm_params:
      model: openai/nomic-embed-text
      api_base: os.environ/LOCAL_MODEL_API_BASE
      api_key: "lm-studio"

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY


router_settings:
  routing_strategy: simple-shuffle
  redis_host: redis
  redis_port: 6379
  cache_responses: true
  enable_pre_call_checks: false
  fallbacks:
    - {"lm-studio-model": ["gemini-2.5-flash", "gpt-4o"]}
    - {"lm-studio-embedding": ["text-embedding-3-small"]}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: False
