model_list:
  # Chat Model
  - model_name: lm-studio-model
    litellm_params:
      model: openai/local-model      # Name mappings for LM Studio
      api_base: http://172.30.80.1:1234/v1 # Corrected to reported reachability
      api_key: "lm-studio"
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  
  # Embedding Model
  - model_name: lm-studio-embedding
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://172.30.80.1:1234/v1
      api_key: "lm-studio"

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY


router_settings:
  routing_strategy: usage-based-routing
  redis_host: redis
  redis_port: 6379
  cache_responses: true
  fallbacks:
    - {"lm-studio-model": ["gemini-2.5-flash", "gpt-4o"]}
    - {"lm-studio-embedding": ["text-embedding-3-small"]}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: False
